name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          # setup-python has no 3.8 build for Ubuntu 26.04, so the oldest
          # supported interpreter stays on 24.04 when ubuntu-latest moves on.
          - os: ubuntu-24.04
            python-version: "3.8"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run unit tests
      run: |
        python -m unittest discover tests

    - name: Test CLI installation
      run: |
        pip install .
        pii-masker --version
        pii-masker mask "Contact support@example.com at +84912345678"
