name: "🐛 Bug Report"
description: File a bug report to help us improve pii-masker-ai.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Sample prompt text or CLI invocation that caused unexpected behavior.
      placeholder: |
        Input text: "..."
        Result: "..."
        Expected: "..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What pattern should have matched or what result did you expect?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, Python version, pii-masker-ai version
      placeholder: Ubuntu 24.04 / macOS / Windows 11, Python 3.12, pii-masker-ai v0.2.0
